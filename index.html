/* ════════════════════ FILA DE APROVAÇÃO ════════════════════ */
const ORDENACOES = ["Data de publicação", "Envio mais recente"];

function QueueView({ items, currentUser, onUpdate, onDelete, toast, initialOpenId }) {
  // fStatus vazio = "em andamento" (os três primeiros quadros, mais aprovados que esperam a externa).
  const [fStatus, setFStatus] = useS("");
  const [fCanal, setFCanal] = useS("");
  const [fPessoa, setFPessoa] = useS("");
  const [fOrdem, setFOrdem] = useS("");
  const [q, setQ] = useS("");
  const [openId, setOpenId] = useS(initialOpenId || null);

  // Pessoas presentes nos dados (inclui membros inativos que já enviaram ou aprovaram)
  const pessoas = useMemo(() => {
    const set = new Set([...TEAM_ATIVOS, ...items.flatMap(it => [it.autor, it.aprovador, it.aprovadorSecundario])].filter(Boolean));
    return [...set].sort();
  }, [items]);

  // Sem ordenação escolhida: pendentes pela publicação mais próxima, os demais pelo envio mais recente.
  const ordem = fOrdem || (!fStatus || STATUS_ANDAMENTO.includes(fStatus) ? "Data de publicação" : "Envio mais recente");

  const filtered = useMemo(() => {
    const lista = items.filter((it) => {
      if (it.id === initialOpenId) return true;
      // A busca procura em todos os status; sem busca vale o quadro escolhido.
      if (!q) {
        if (!fStatus && !emAndamento(it)) return false;
        if (fStatus && it.status !== fStatus && !(fStatus === "Aguardando aprovação externa" && externaPendente(it))) return false;
      }
      return (!fCanal || it.canal === fCanal) &&
        (!fPessoa || [it.autor, it.aprovador, it.aprovadorSecundario].includes(fPessoa)) &&
        (!q || (it.titulo + " " + it.conteudo + " " + it.id + " " + it.autor).toLowerCase().includes(q.toLowerCase()));
    });
    const envio = (it) => (parseData(it.dataEnvio) || 0);
    if (ordem === "Data de publicação") {
      const pub = (it) => (parseData(it.dataPostagem) || null);
      return lista.sort((a, b) => {
        const pa = pub(a), pb = pub(b);
        if (pa && pb) return pa - pb;
        if (pa || pb) return pa ? -1 : 1; // sem data vai para o fim
        return envio(b) - envio(a);
      });
    }
    return lista.sort((a, b) => envio(b) - envio(a));
  }, [items, fStatus, fCanal, fPessoa, q, ordem, initialOpenId]);

  useEffect_(() => {
    if (!initialOpenId) return;
    if (filtered.length === 0) return;
    setOpenId(initialOpenId);
    setTimeout(() => {
      const el = document.querySelector(`[data-qitem-id="${initialOpenId}"]`);
      if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
    }, 100);
  }, [initialOpenId, filtered.length]);

  const counts = useMemo(() => {
    const c = {}; STATUS_ORDER.forEach((s) => c[s] = 0);
    items.forEach((it) => {
      c[it.status]++;
      if (externaPendente(it) && it.status !== "Aguardando aprovação externa") c["Aguardando aprovação externa"]++;
    });
    c.andamento = items.filter(emAndamento).length;
    return c;
  }, [items]);

  const ativo = (s) => fStatus ? fStatus === s : STATUS_ANDAMENTO.includes(s);

  return (
    <div className="view">
      <header className="view-head">
        <h1>Fila de aprovação</h1>
        <p>Tudo o que está em circulação. Os mais urgentes aparecem primeiro.</p>
      </header>

      <div className="stat-row" style={{marginBottom:8}}>
        {[...STATUS_ANDAMENTO, ...STATUS_ORDER.filter(s => !STATUS_ANDAMENTO.includes(s))].map((s) => (
          <button key={s} className={"stat" + (ativo(s) ? " is-active" : "")} aria-pressed={ativo(s)}
            onClick={() => setFStatus(fStatus === s ? "" : s)}>
            <span className="stat-num" style={{ color: STATUS[s].color }}>{counts[s]}</span>
            <span className="stat-lab">{STATUS[s].label}</span>
          </button>
        ))}
      </div>
      <p className="stat-caption">
        {q ? <>Buscando em <b>todos os status</b>.</>
          : fStatus ? <>Mostrando só <b>{STATUS[fStatus].label.toLowerCase()}</b>. <button className="tl-link" onClick={() => setFStatus("")}>Voltar para em andamento</button></>
          : <>Mostrando os <b>{counts.andamento} em andamento</b> (os três primeiros quadros, incluindo aprovados que ainda esperam a externa). Clique num quadro para ver só aquele status.</>}
      </p>

      <div className="filters">
        <div className="search">
          <Icon name="filter" size={15} />
          <input className="search-input" value={q} onChange={(e) => setQ(e.target.value)} placeholder="Buscar por título, ID, autor ou conteúdo…" />
        </div>
        <Select value={fCanal} onChange={setFCanal} options={Object.keys(CHANNELS)} placeholder="Canal" />
        <Select value={fPessoa} onChange={setFPessoa} options={pessoas} placeholder="Pessoa" />
        <Select value={fOrdem} onChange={setFOrdem} options={ORDENACOES} placeholder={"Ordenar: " + (ordem === "Data de publicação" ? "publicação" : "envio")} />
      </div>

      <div className="qlist">
        {filtered.length === 0 && <div className="empty"><Icon name="inbox" size={26} /><p>Nenhum conteúdo com esses filtros.</p></div>}
        {filtered.map((it) => (
          <QueueItem key={it.id} item={it} currentUser={currentUser} onUpdate={onUpdate} onDelete={onDelete} toast={toast}
            open={openId === it.id} onToggle={() => setOpenId(openId === it.id ? null : it.id)} />
        ))}
      </div>
    </div>
  );
}

/* ════════════════════ LISTA COMPACTA (Painel e Meus envios) ════════════════════ */
// Linha de uma linha só; ao clicar, abre o card completo logo abaixo.
function CompactItem({ item, currentUser, onUpdate, onDelete, toast, open, onToggle, info, dias }) {
  const com = comQuem(item);
  const ext = !!com && (item.status === "Aguardando aprovação externa" || (item.status === "Aprovado" && externaPendente(item)));
  return (
    <li className={"citem" + (open ? " is-open" : "")} data-qitem-id={item.id}>
      <button className="citem-head" onClick={onToggle} aria-expanded={open}
        title={com ? "Com quem está agora: " + com : "Enviado por: " + item.autor}>
        {ext ? <span className="qitem-ext-av"><Icon name="globe" size={14} /></span> : <Avatar name={com || item.autor} size={26} />}
        <span className="citem-title">{item.titulo}</span>
        {info && <span className="citem-info">{info}</span>}
        {dias != null && <span className={"citem-dias" + (dias >= 14 ? " is-velho" : "")}>{dias <= 0 ? "hoje" : "há " + plural(dias, "dia", "dias")}</span>}
        <span className="citem-chev"><Icon name="chevron" size={16} /></span>
      </button>
      {open && <ItemDetail item={item} currentUser={currentUser} onUpdate={onUpdate} onDelete={onDelete} toast={toast} />}
    </li>
  );
}

const porData = (campo, desc) => (a, b) => {
  const x = parseData(a[campo]) || 0, y = parseData(b[campo]) || 0;
  return desc ? y - x : x - y;
};

/* ════════════════════ PAINEL DO APROVADOR ════════════════════ */
function ApproverView({ items, currentUser, onUpdate, onDelete, toast, irParaFila }) {
  // Depende de você: só aprovação e parecer. O que espera o autor ou o externo fica em seções próprias.
  const depende = items.filter((it) => it.status === "Aguardando aprovação" &&
    (it.aprovador === currentUser || (it.aprovadorSecundario === currentUser && !it.parecerSecundario)));
  const aguardandoExterno = items.filter((it) => it.aprovador === currentUser && externaPendente(it) &&
    it.statusExterno !== "Com ressalvas" && (it.status === "Aguardando aprovação externa" || it.status === "Aprovado"))
    .sort(porData("dataDecisao"));
  const aguardandoAutor = items.filter((it) => it.aprovador === currentUser && it.status === "Ajustes solicitados")
    .sort(porData("dataDecisao"));
  const decididos = items.filter((it) => it.aprovador === currentUser && it.status === "Aprovado" && !externaPendente(it))
    .sort(porData("dataDecisao", true)).slice(0, 5);
  const [openId, setOpenId] = useS(depende[0] ? depende[0].id : null);
  const props = (it) => ({ item: it, currentUser, onUpdate, onDelete, toast,
    open: openId === it.id, onToggle: () => setOpenId(openId === it.id ? null : it.id) });

  return (
    <div className="view">
      <header className="view-head">
        <h1>Painel do aprovador</h1>
        <p>O que depende de você, <strong>{currentUser}</strong>, e o que você está esperando.</p>
      </header>

      <section className="painel-sec">
        <h2 className="painel-h">Depende de você · {depende.length}</h2>
        {depende.length === 0
          ? <p className="painel-vazio"><Icon name="check2" size={16} /> Nenhum conteúdo esperando sua aprovação ou seu parecer.</p>
          : <div className="qlist">{depende.map((it) => <QueueItem key={it.id} {...props(it)} />)}</div>}
      </section>

      {aguardandoExterno.length > 0 && (
        <section className="painel-sec">
          <h2 className="painel-h">Você aprovou, aguardando o externo · {aguardandoExterno.length}</h2>
          <ul className="clist">
            {aguardandoExterno.map((it) => <CompactItem key={it.id} {...props(it)} info={"com " + contatoCurto(it.contatoExterno)} dias={diasDesde(it.dataDecisao)} />)}
          </ul>
        </section>
      )}

      {aguardandoAutor.length > 0 && (
        <section className="painel-sec">
          <h2 className="painel-h">Você pediu ajustes, aguardando o autor · {aguardandoAutor.length}</h2>
          <ul className="clist">
            {aguardandoAutor.map((it) => <CompactItem key={it.id} {...props(it)} info={"com " + it.autor} dias={diasDesde(it.dataDecisao)} />)}
          </ul>
        </section>
      )}

      {decididos.length > 0 && (
        <section className="painel-sec">
          <h2 className="painel-h">Decididos recentemente</h2>
          <ul className="clist">
            {decididos.map((it) => <CompactItem key={it.id} {...props(it)} info={it.id + " · aprovado " + fmtDate(it.dataDecisao)} />)}
          </ul>
          {irParaFila && <button className="tl-link" onClick={irParaFila}>Ver todos na fila →</button>}
        </section>
      )}
    </div>
  );
}

/* ════════════════════ EDITAR CONTEÚDO (autor) ════════════════════ */
function EditPanel({ item, currentUser, onUpdate, toast, close }) {
  const editingCorrected = !!item.versaoCorrigida;
  const [f, setF] = useS({
    autor: item.autor || "",
    canal: item.canal || "Redes sociais",
    tipoAprovacao: item.tipoAprovacao || "Ambos",
    titulo: item.titulo || "",
    conteudo: editingCorrected ? item.versaoCorrigida : (item.conteudo || ""),
    linkMidia: item.linkMidia || "",
    dataPostagem: item.dataPostagem || "",
    aprovador: item.aprovador || "",
    aprovadorSecundario: item.aprovadorSecundario || "",
    precisaExterna: !!item.precisaExterna,
    contatoExterno: item.contatoExterno || "",
  });
  const set = (k) => (v) => setF((x) => ({ ...x, [k]: v }));
  const setE = (k) => (e) => set(k)(e.target.value);

  function save() {
    if (!f.titulo.trim() || !f.conteudo.trim()) { toast("Título e conteúdo não podem ficar vazios.", "error"); return; }
    if (!f.aprovador) { toast("Indique o aprovador principal.", "error"); return; }
    const patch = {
      autor: f.autor, canal: f.canal, tipoAprovacao: f.tipoAprovacao,
      titulo: f.titulo.trim(), linkMidia: f.linkMidia.trim(), dataPostagem: f.dataPostagem,
      aprovador: f.aprovador, aprovadorSecundario: f.aprovadorSecundario,
      precisaExterna: f.precisaExterna, contatoExterno: f.contatoExterno.trim(),
    };
    const campoTexto = editingCorrected ? "versaoCorrigida" : "conteudo";
    patch[campoTexto] = f.conteudo;
    const edicoes = registrarEdicao(item, campoTexto, f.conteudo, currentUser);
    if (edicoes) patch.edicoes = edicoes;
    onUpdate(item.id, patch);
    toast("Conteúdo atualizado.", "success");
    close();
  }
  return (
    <div className="action-block">
      <div className="action-head"><Icon name="edit" size={16} /><strong>Editar envio</strong></div>
      <div className="form-grid">
        <Field label="Autor" required>
          <Select value={f.autor} onChange={set("autor")} options={TEAM_ATIVOS} placeholder="Autor" />
        </Field>
        <Field label="Canal" required>
          <Select value={f.canal} onChange={set("canal")} options={Object.keys(CHANNELS)} />
        </Field>
      </div>
      <Field label="Tipo de aprovação" required>
        <div className="seg">
          {APPROVAL_TYPES.map((t) => (
            <button type="button" key={t}
              className={"seg-btn" + (f.tipoAprovacao === t ? " is-active" : "")}
              onClick={() => set("tipoAprovacao")(t)}>{t}</button>
          ))}
        </div>
      </Field>
      <Field label="Título / descrição" required>
        <input className="input" value={f.titulo} onChange={setE("titulo")} />
      </Field>
      <Field label={editingCorrected ? "Versão corrigida" : "Conteúdo"} required>
        <textarea className="input textarea" rows={6} value={f.conteudo} onChange={setE("conteudo")} />
      </Field>
      <div className="form-grid">
        <Field label="Link de mídia" hint="Opcional">
          <input className="input" value={f.linkMidia} onChange={setE("linkMidia")} placeholder="https://…" />
        </Field>
        <Field label="Data de postagem prevista" hint="Opcional">
          <input className="input" type="date" value={f.dataPostagem} onChange={setE("dataPostagem")} />
        </Field>
      </div>
      <div className="form-grid">
        <Field label="Aprovador principal" required>
          <Select value={f.aprovador} onChange={set("aprovador")} options={TEAM_ATIVOS} placeholder="Escolha um aprovador" />
        </Field>
        <Field label="Aprovador secundário" hint="Opcional">
          <Select value={f.aprovadorSecundario} onChange={set("aprovadorSecundario")} options={TEAM_ATIVOS} placeholder="Nenhum" />
        </Field>
      </div>
      <label className="cc-check">
        <input type="checkbox" checked={f.precisaExterna} onChange={(e) => set("precisaExterna")(e.target.checked)} />
        <span>Precisa de aprovação externa</span>
      </label>
      {f.precisaExterna && (
        <Field label="Contato do aprovador externo" hint="Nome e contato">
          <input className="input" value={f.contatoExterno} onChange={setE("contatoExterno")} placeholder="Ex.: Maria (cliente XPTO)" />
        </Field>
      )}
      <div className="action-row">
        <Button variant="ghost" size="sm" onClick={close}>Cancelar</Button>
        <Button variant="primary" icon="check2" onClick={save}>Salvar alterações</Button>
      </div>
    </div>
  );
}

/* ════════════════════ VERSÃO CORRIGIDA (reenvio) ════════════════════ */
function ResendPanel({ item, onUpdate, toast }) {
  const [text, setText] = useS(item.versaoCorrigida || item.conteudo);
  const [checkIA, setCheckIA] = useS(false);
  const exigeCheck = needsIACheck(item);

  function resend() {
    if (!text.trim()) return;
    if (exigeCheck && !checkIA) { toast("Confirme que passou a versão corrigida pelo check de IA.", "error"); return; }
    // Guarda a rodada inteira (texto revisado + todos os pareceres), porque o reenvio limpa esses campos.
    const entrada = {
      rodada: (item.historicoAjustes || []).length + 1,
      aprovador: item.aprovador,
      comentario: item.comentarios,
      dataDecisao: item.dataDecisao,
      dataReenvio: nowStr(),
      texto: item.versaoCorrigida || item.conteudo,
      secundario: item.aprovadorSecundario || "",
      parecerSecundario: item.parecerSecundario || "",
      comentarioSecundario: item.comentarioSecundario || "",
      contatoExterno: item.contatoExterno || "",
      statusExterno: item.statusExterno || "",
      comentarioExterno: item.comentarioExterno || "",
      dataExterna: item.dataExterna || "",
      imagensAjuste: item.imagensAjuste || [],
      anexosAprovacao: item.anexosAprovacao || [],
    };
    onUpdate(item.id, {
      versaoCorrigida: text,
      status: "Aguardando aprovação",
      checkIA: exigeCheck ? true : item.checkIA,
      comentarios: "", dataDecisao: "",
      parecerSecundario: "", comentarioSecundario: "",
      statusExterno: "", comentarioExterno: "", dataExterna: "",
      imagensAjuste: [], anexosAprovacao: [],
      historicoAjustes: [...(item.historicoAjustes || []), entrada],
    });
    toast("Versão corrigida reenviada para a fila.", "success");
  }

  return (
    <div className="action-block">
      <div className="action-head"><Icon name="edit" size={16} /><strong>Versão corrigida</strong></div>
      <p className="action-note">Edite abaixo a versão com os ajustes pedidos e reenvie. A versão original continua visível para comparação.</p>
      <textarea className="input textarea" rows={7} value={text} onChange={(e) => setText(e.target.value)}
        placeholder="Cole/edite aqui a versão corrigida do conteúdo." />
      {exigeCheck && (
        <>
          <div className="check-steps">
            <Button variant="outline" icon="copy" size="sm"
              onClick={() => copyCheckText({ ...item, versaoCorrigida: text }, toast)}>Copiar para check de IA</Button>
          </div>
          <label className="cc-check">
            <input type="checkbox" checked={checkIA} onChange={(e) => setCheckIA(e.target.checked)} />
            <span>Passei a versão corrigida no check de IA <span className="req">*</span></span>
          </label>
        </>
      )}
      <div className="action-row">
        <Button variant="primary" icon="send" disabled={!text.trim() || (exigeCheck && !checkIA)} onClick={resend}>Reenviar versão corrigida</Button>
      </div>
    </div>
  );
}

/* ════════════════════ MEUS ENVIOS ════════════════════ */
function MyView({ items, currentUser, onUpdate, onDelete, toast }) {
  const isHistorico = currentUser === USUARIO_ANTERIORES;
  const [fAutorHist, setFAutorHist] = useS("");
  const [openId, setOpenId] = useS(null);
  const [verTodosAprovados, setVerTodosAprovados] = useS(false);
  const [verCancelados, setVerCancelados] = useS(false);

  if (isHistorico) {
    const histItems = items.filter(it => TEAM_INATIVOS.includes(it.autor));
    const filtered = fAutorHist ? histItems.filter(it => it.autor === fAutorHist) : histItems;
    return (
      <div className="view">
        <header className="view-head">
          <h1>Usuários anteriores</h1>
          <p>Histórico de conteúdos enviados por membros que saíram da equipe.</p>
        </header>
        <div style={{marginBottom:18,display:"flex",gap:10,alignItems:"center"}}>
          <Select value={fAutorHist} onChange={setFAutorHist}
            options={TEAM_INATIVOS.filter(n => items.some(it => it.autor === n))}
            placeholder="Todos" />
        </div>
        {filtered.length === 0
          ? <div className="empty big"><Icon name="send" size={28} /><p>Nenhum conteúdo encontrado.</p></div>
          : <div className="qlist">{filtered.map(it => (
              <QueueItem key={it.id} item={it} currentUser={currentUser} onUpdate={onUpdate} onDelete={onDelete} toast={toast}
                open={openId === it.id} onToggle={() => setOpenId(openId === it.id ? null : it.id)} />
            ))}</div>
        }
      </div>
    );
  }

  const mine = items.filter((it) => it.autor === currentUser);
  const precisa = mine.filter((it) => it.status === "Ajustes solicitados");
  const emAprovacao = mine.filter((it) => emAndamento(it) && it.status !== "Ajustes solicitados").sort(porData("dataEnvio", true));
  const aprovados = mine.filter((it) => it.status === "Aprovado" && !externaPendente(it)).sort(porData("dataEnvio", true));
  const cancelados = mine.filter((it) => it.status === "Cancelado").sort(porData("dataEnvio", true));
  const aprovadosVisiveis = verTodosAprovados ? aprovados : aprovados.slice(0, 5);
  const props = (it) => ({ item: it, currentUser, onUpdate, onDelete, toast,
    open: openId === it.id, onToggle: () => setOpenId(openId === it.id ? null : it.id) });

  return (
    <div className="view">
      <header className="view-head">
        <h1>Meus envios</h1>
        <p>O que você enviou, <strong>{currentUser}</strong>, separado pelo que precisa de você.</p>
      </header>

      {mine.length === 0 && (
        <div className="empty big"><Icon name="send" size={28} /><p>Você ainda não enviou nenhum conteúdo.</p></div>
      )}

      {mine.length > 0 && (
        <section className="painel-sec">
          <h2 className="painel-h">Precisa de você · {precisa.length}</h2>
          {precisa.length === 0
            ? <p className="painel-vazio"><Icon name="check2" size={16} /> Nenhum envio seu com ajustes pedidos.</p>
            : <div className="qlist">{precisa.map((it) => <QueueItem key={it.id} {...props(it)} />)}</div>}
        </section>
      )}

      {emAprovacao.length > 0 && (
        <section className="painel-sec">
          <h2 className="painel-h">Em aprovação · {emAprovacao.length}</h2>
          <div className="qlist">{emAprovacao.map((it) => <QueueItem key={it.id} {...props(it)} />)}</div>
        </section>
      )}

      {aprovados.length > 0 && (
        <section className="painel-sec">
          <h2 className="painel-h">Aprovados · {aprovados.length}</h2>
          <ul className="clist">
            {aprovadosVisiveis.map((it) => <CompactItem key={it.id} {...props(it)}
              info={it.id + (it.dataPostagem ? " · publicação " + fmtDate(it.dataPostagem) : " · aprovado " + fmtDate(it.dataDecisao))} />)}
          </ul>
          {aprovados.length > 5 && (
            <button className="tl-link" onClick={() => setVerTodosAprovados(!verTodosAprovados)}>
              {verTodosAprovados ? "Mostrar só os 5 mais recentes" : `Ver todos os aprovados (${aprovados.length})`}
            </button>
          )}
        </section>
      )}

      {cancelados.length > 0 && (
        <section className="painel-sec">
          <button className="tl-link" onClick={() => setVerCancelados(!verCancelados)}>
            {verCancelados ? "Ocultar cancelados" : `Ver cancelados (${cancelados.length})`}
          </button>
          {verCancelados && (
            <ul className="clist">
              {cancelados.map((it) => <CompactItem key={it.id} {...props(it)} info={it.id + " · cancelado"} />)}
            </ul>
          )}
        </section>
      )}
    </div>
  );
}

/* ════════════════════ CONFIGURAÇÕES (admin) ════════════════════ */
function ConfigView({ toast, onTeamChange }) {
  const [equipe, setEquipe] = useS(null);
  const [editingEmail, setEditingEmail] = useS(null);
  const [emailDraft, setEmailDraft] = useS('');
  const [newNome, setNewNome] = useS('');
  const [newEmail, setNewEmail] = useS('');
  const [busy, setBusy] = useS(false);

  async function load() {
    const { data } = await sb.from('equipe').select('nome, ativo, email, ordem').order('ordem');
    setEquipe(data || []);
  }

  useEffect_(() => { load(); }, []);

  async function reloadGlobals() {
    const { data } = await sb.from('equipe').select('nome, ativo, email').order('ordem');
    if (!data) return;
    window.TEAM          = data.map(r => r.nome);
    window.TEAM_ATIVOS   = data.filter(r => r.ativo).map(r => r.nome);
    window.TEAM_INATIVOS = data.filter(r => !r.ativo).map(r => r.nome);
    window.__TEAM_EMAILS__ = {};
    data.forEach(r => { if (r.email) window.__TEAM_EMAILS__[r.nome] = r.email; });
    TEAM_ATIVOS   = window.TEAM_ATIVOS;
    TEAM_INATIVOS = window.TEAM_INATIVOS;
    if (onTeamChange) onTeamChange();
  }

  async function toggleAtivo(member, ativo) {
    setBusy(true);
    const { error } = await sb.from('equipe').update({ ativo }).eq('nome', member.nome);
    if (error) toast('Erro: ' + error.message, 'error');
    else {
      toast(ativo ? member.nome + ' reativado.' : member.nome + ' movido para usuários anteriores.', 'success');
      await load(); await reloadGlobals();
    }
    setBusy(false);
  }

  async function saveEmail(member) {
    setBusy(true);
    const { error } = await sb.from('equipe').update({ email: emailDraft.trim() }).eq('nome', member.nome);
    if (error) toast('Erro: ' + error.message, 'error');
    else {
      toast('E-mail atualizado.', 'success');
      setEditingEmail(null);
      await load(); await reloadGlobals();
    }
    setBusy(false);
  }

  async function addMember() {
    if (!newNome.trim()) return;
    setBusy(true);
    const maxOrdem = (equipe || []).reduce((m, e) => Math.max(m, e.ordem || 0), 0);
    const { error } = await sb.from('equipe').insert({ nome: newNome.trim(), ativo: true, email: newEmail.trim(), ordem: maxOrdem + 1 });
    if (error) toast('Erro: ' + error.message, 'error');
    else {
      toast(newNome.trim() + ' adicionado à equipe.', 'success');
      setNewNome(''); setNewEmail('');
      await load(); await reloadGlobals();
    }
    setBusy(false);
  }

  const ativos   = (equipe || []).filter(m => m.ativo);
  const inativos = (equipe || []).filter(m => !m.ativo);

  function memberRow(m) {
    const isEditing = editingEmail === m.nome;
    return (
      <div key={m.nome} style={{display:'flex',alignItems:'center',gap:12,padding:'12px 16px',background:'var(--surface-2)',borderRadius:'var(--radius-sm)',border:'1px solid var(--line-2)',opacity:m.ativo?1:.65}}>
        <Avatar name={m.nome} size={34}/>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontWeight:600,fontSize:15}}>{m.nome}</div>
          {isEditing ? (
            <div style={{display:'flex',gap:6,marginTop:5,alignItems:'center',flexWrap:'wrap'}}>
              <input className="input" style={{padding:'5px 9px',fontSize:13,height:'auto',maxWidth:280}}
                value={emailDraft} onChange={e => setEmailDraft(e.target.value)}
                placeholder="email@dtidigital.com.br" autoFocus />
              <Button variant="primary" size="sm" icon="check2" disabled={busy} onClick={() => saveEmail(m)}>Salvar</Button>
              <Button variant="ghost" size="sm" onClick={() => setEditingEmail(null)}>Cancelar</Button>
            </div>
          ) : (
            <div style={{display:'flex',alignItems:'center',gap:5,marginTop:2}}>
              <span style={{fontSize:13,color:'var(--ink-3)'}}>{m.email || <em>e-mail não definido</em>}</span>
              <button style={{background:'none',border:'none',cursor:'pointer',color:'var(--ink-3)',padding:'1px 4px',borderRadius:4}}
                title="Editar e-mail" onClick={() => { setEditingEmail(m.nome); setEmailDraft(m.email || ''); }}>
                <Icon name="edit" size={13}/>
              </button>
            </div>
          )}
        </div>
        {!isEditing && (
          m.ativo
            ? <Button variant="ghost" size="sm" disabled={busy} onClick={() => toggleAtivo(m, false)}>Mover para anteriores</Button>
            : <Button variant="outline" size="sm" disabled={busy} onClick={() => toggleAtivo(m, true)}>Reativar</Button>
        )}
      </div>
    );
  }

  return (
    <div className="view view-narrow">
      <header className="view-head">
        <h1>Configurações</h1>
        <p>Gerencie os membros da equipe. Apenas administradores têm acesso.</p>
      </header>

      <div className="card form">
        <div className="section-label">
          <Icon name="users" size={17}/>Membros ativos
          <span className="count-pill">{ativos.length}</span>
        </div>
        {equipe === null
          ? <div className="empty"><Icon name="clock" size={22}/><p>Carregando…</p></div>
          : <div style={{display:'flex',flexDirection:'column',gap:8}}>{ativos.map(memberRow)}</div>
        }
      </div>

      {inativos.length > 0 && (
        <div className="card form" style={{marginTop:16}}>
          <div className="section-label muted">
            <Icon name="users" size={17}/>Usuários anteriores
            <span className="count-pill">{inativos.length}</span>
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:8}}>{inativos.map(memberRow)}</div>
        </div>
      )}

      <div className="card form" style={{marginTop:16}}>
        <div className="section-label"><Icon name="check2" size={17}/>Adicionar membro</div>
        <Field label="Nome" required>
          <input className="input" value={newNome} onChange={e => setNewNome(e.target.value)} placeholder="Ex.: Fernanda" />
        </Field>
        <Field label="E-mail do Teams" hint="Usado para @menções nas notificações">
          <input className="input" value={newEmail} onChange={e => setNewEmail(e.target.value)} placeholder="nome@dtidigital.com.br" />
        </Field>
        <div className="form-actions">
          <Button variant="primary" icon="check2" disabled={!newNome.trim() || busy} onClick={addMember}>
            Adicionar à equipe
          </Button>
        </div>
      </div>
    </div>
  );
}

Object.assign(window, { SubmitView, QueueView, ApproverView, MyView, EditPanel, ResendPanel, ConfigView });

<script type="text/babel" data-presets="react">
// app.jsx — raiz: navegação, usuário, estado + sincronização com Supabase.
const { useState: useState_, useEffect: useEffect_ } = React;
const { createClient } = supabase;

// Cliente Supabase — reutilizado em todo o app.
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

const NAV = [
  { id: "enviar",    label: "Enviar conteúdo",    icon: "send" },
  { id: "meus",      label: "Meus envios",         icon: "user" },
  { id: "fila",      label: "Fila de aprovação",   icon: "inbox" },
  { id: "aprovador", label: "Painel do aprovador", icon: "check" },
  { id: "config",    label: "Configurações",       icon: "settings", adminOnly: true },
];

// ── Converte linha do banco (snake_case) → objeto do app (camelCase) ──
function fromDb(r) {
  return {
    id: r.id,
    dataEnvio: r.data_envio || '',
    autor: r.autor || '',
    canal: r.canal || '',
    tipoAprovacao: r.tipo_aprovacao || '',
    titulo: r.titulo || '',
    conteudo: r.conteudo || '',
    linkMidia: r.link_midia || '',
    status: r.status || 'Aguardando aprovação',
    checkIA: r.check_ia || false,
    aprovador: r.aprovador || '',
    dataPostagem: r.data_postagem || '',
    comentarios: r.comentarios || '',
    dataDecisao: r.data_decisao || '',
    notas: Array.isArray(r.notas) ? r.notas : [],
    versaoCorrigida: r.versao_corrigida || '',
    aprovadorSecundario: r.aprovador_secundario || '',
    parecerSecundario: r.parecer_secundario || '',
    comentarioSecundario: r.comentario_secundario || '',
    precisaExterna: r.precisa_externa || false,
    contatoExterno: r.contato_externo || '',
    statusExterno: r.status_externo || '',
    comentarioExterno: r.comentario_externo || '',
    dataExterna: r.data_externa || '',
    historicoAjustes: Array.isArray(r.historico_ajustes) ? r.historico_ajustes : [],
    imagensAjuste: Array.isArray(r.imagens_ajuste) ? r.imagens_ajuste : [],
    anexosAprovacao: Array.isArray(r.anexos_aprovacao) ? r.anexos_aprovacao : [],
    notionId: r.notion_id || '',
    cancelamento: r.cancelamento || null,
    edicoes: Array.isArray(r.edicoes) ? r.edicoes : [],
  };
}

// ── Converte objeto do app → linha do banco ──────────────────────
function toDb(it) {
  return {
    id: it.id, data_envio: it.dataEnvio, autor: it.autor,
    canal: it.canal, tipo_aprovacao: it.tipoAprovacao,
    titulo: it.titulo, conteudo: it.conteudo,
    link_midia: it.linkMidia || '', status: it.status,
    check_ia: !!it.checkIA, aprovador: it.aprovador,
    data_postagem: it.dataPostagem || '', comentarios: it.comentarios || '',
    data_decisao: it.dataDecisao || '', notas: it.notas || [],
    versao_corrigida: it.versaoCorrigida || '',
    aprovador_secundario: it.aprovadorSecundario || '',
    parecer_secundario: it.parecerSecundario || '',
    comentario_secundario: it.comentarioSecundario || '',
    precisa_externa: !!it.precisaExterna,
    contato_externo: it.contatoExterno || '',
    status_externo: it.statusExterno || '',
    comentario_externo: it.comentarioExterno || '',
    data_externa: it.dataExterna || '',
    historico_ajustes: it.historicoAjustes || [],
    imagens_ajuste: it.imagensAjuste || [],
    anexos_aprovacao: it.anexosAprovacao || [],
    notion_id: it.notionId || '',
  };
}

// ── Converte apenas os campos de um patch (atualização parcial) ──
const _PM = {
  dataEnvio:'data_envio', tipoAprovacao:'tipo_aprovacao', linkMidia:'link_midia',
  checkIA:'check_ia', dataPostagem:'data_postagem', dataDecisao:'data_decisao',
  versaoCorrigida:'versao_corrigida', aprovadorSecundario:'aprovador_secundario',
  parecerSecundario:'parecer_secundario', comentarioSecundario:'comentario_secundario',
  precisaExterna:'precisa_externa', contatoExterno:'contato_externo',
  statusExterno:'status_externo', comentarioExterno:'comentario_externo',
  dataExterna:'data_externa', historicoAjustes:'historico_ajustes',
  imagensAjuste:'imagens_ajuste',
  anexosAprovacao:'anexos_aprovacao',
  notionId:'notion_id',
};
function patchToDb(patch) {
  const out = {};
  for (const [k, v] of Object.entries(patch)) out[_PM[k] || k] = v;
  return out;
}

// ── Próximo ID sequencial (C-001, C-002…) ───────────────────────
async function nextId() {
  const { data } = await sb.from('conteudos').select('id');
  let max = 0;
  (data || []).forEach(r => {
    const m = String(r.id).match(/^C-(\d+)/);
    if (m) max = Math.max(max, parseInt(m[1], 10));
  });
  return 'C-' + String(max + 1).padStart(3, '0');
}

// ── Hora atual formatada ─────────────────────────────────────────
function nowStr() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

// ── Decide o rótulo da notificação a partir do que mudou ─────────
function updateLabel(patch) {
  if (patch.cancelamento !== undefined) return ''; // cancelar/reabrir não notifica
  if (patch.statusExterno === 'Aprovado') return 'Aprovação externa concluída';
  if (patch.statusExterno === 'Com ressalvas') return 'Ajustes solicitados (aprovação externa)';
  if (patch.status === 'Aguardando aprovação externa') return 'Aprovado internamente — aguardando externa';
  if (patch.status === 'Aprovado') return 'Conteúdo aprovado';
  if (patch.parecerSecundario === 'Com ressalvas') return 'Ajustes solicitados pelo 2º aprovador';
  if (patch.status === 'Ajustes solicitados') return 'Ajustes solicitados';
  if (patch.versaoCorrigida && patch.status === 'Aguardando aprovação') return 'Versão corrigida reenviada';
  if (patch.parecerSecundario) return 'Parecer do secundário: ' + patch.parecerSecundario;
  if (patch.notas !== undefined) return ''; // comentários no texto não notificam
  return 'Conteúdo atualizado';
}

// ── Notificação no Teams via Apps Script como proxy ──────────────
function notifyTeams(acao, item) {
  const url = window.__NOTIFY_URL__;
  if (!url) return;
  const link = window.location.origin + window.location.pathname + "?id=" + encodeURIComponent(item.id);
  fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: 'notify', acao, item, link, teamEmails: window.__TEAM_EMAILS__ || {} }),
  }).catch(() => {});
}

// Tenta ler o e-mail do JWT do Cloudflare Access (cookie CF_Authorization)
function readCFEmail() {
  try {
    const cookie = document.cookie.split(';').map(c => c.trim()).find(c => c.startsWith('CF_Authorization='));
    if (!cookie) return null;
    const jwt = cookie.split('=').slice(1).join('=');
    const payload = jwt.split('.')[1];
    if (!payload) return null;
    const json = JSON.parse(atob(payload.replace(/-/g,'+').replace(/_/g,'/')));
    return json.email || null;
  } catch { return null; }
}

// Tenta mapear e-mail do Cloudflare para um nome da equipe
function cfEmailToName(email) {
  if (!email) return null;
  const map = window.__EMAIL_MAP__ || {};
  if (map[email]) return map[email];
  // fallback: tenta pelo prefixo do e-mail (ex: alice.goncalves → Alice)
  const prefix = email.split('@')[0].split('.')[0];
  const match = TEAM_ATIVOS.find(n => n.toLowerCase() === prefix.toLowerCase());
  return match || null;
}

function WhoAreYouModal({ onConfirm, suggested }) {
  const [sel, setSel] = useState_(suggested || null);
  const cfEmail = readCFEmail();
  return (
    <div className="who-overlay">
      <div className="who-card">
        <div className="who-header">
          <h2>Olá! Quem é você?</h2>
          <p>Selecione seu nome para continuar. Isso garante que suas ações fiquem registradas corretamente.</p>
        </div>
        {suggested && cfEmail && (
          <div className="who-cf-hint">
            <Icon name="check2" size={15} />
            Identificado pelo login: <strong>{cfEmail}</strong>
          </div>
        )}
        <div className="who-grid">
          {TEAM_ATIVOS.map(n => (
            <button key={n} className={"who-opt" + (n === sel ? " is-selected" : "")}
              onClick={() => setSel(n)}>
              <Avatar name={n} size={32} />{n}
              {n === sel && <Icon name="check2" size={15} style={{marginLeft:"auto"}} />}
            </button>
          ))}
        </div>
        <div className="who-actions">
          <button className="who-ext-btn" onClick={() => onConfirm(USUARIO_EXTERNO)}>
            <Icon name="user" size={15} />Entrar como visitante (só visualizar / comentar)
          </button>
          <Button variant="primary" icon="check2" disabled={!sel}
            onClick={() => sel && onConfirm(sel)}>
            Confirmar
          </Button>
        </div>
      </div>
    </div>

}

function App() {
  const urlId = new URLSearchParams(window.location.search).get("id");
  const [route, setRoute] = useState_(urlId ? "fila" : "fila");
  const [teamKey, setTeamKey] = useState_(0);
  function onTeamChange() { setTeamKey(k => k + 1); }

  // Lê o usuário salvo (para pré-selecionar no modal)
  const savedUser = (() => {
    try {
      const u = localStorage.getItem("dti_aprovacoes_user");
      return (TEAM_ATIVOS.includes(u) || u === USUARIO_ANTERIORES || u === USUARIO_EXTERNO) ? u : null;
    } catch { return null; }
  })();

  // Tenta auto-detectar pelo e-mail do Cloudflare
  const cfSuggested = cfEmailToName(readCFEmail());

  // Modal aparece toda vez que a sessão começa (sessionStorage limpa ao fechar aba)
  const sessionConfirmed = (() => { try { return !!sessionStorage.getItem("dti_who_confirmed"); } catch { return false; } })();

  const [user, setUser] = useState_(sessionConfirmed ? (savedUser || cfSuggested || TEAM_ATIVOS[0]) : null);
  const [items, setItems] = useState_(null);
  const [loadError, setLoadError] = useState_(null);
  const [toast, setToast] = useState_(null);
  const [userOpen, setUserOpen] = useState_(false);
  const [saving, setSaving] = useState_(false);

  function confirmUser(name) {
    setUser(name);
    try { localStorage.setItem("dti_aprovacoes_user", name); } catch {}
    try { sessionStorage.setItem("dti_who_confirmed", "1"); } catch {}
  }

  useEffect_(() => { if (user) { try { localStorage.setItem("dti_aprovacoes_user", user); } catch {} } }, [user]);

  async function reload(silent) {
    if (!silent) { setItems(null); setLoadError(null); }
    try {
      const { data, error } = await sb.from('conteudos').select('*').order('created_at', { ascending: false });
      if (error) throw error;
      setItems((data || []).map(fromDb));
      setLoadError(null);
    } catch (e) {
      if (!silent) setLoadError(String(e.message || e));
    }
  }

  useEffect_(() => {
    reload();
    // Atualização em tempo real: a fila muda sozinha quando alguém salva algo.
    const channel = sb.channel('conteudos-rt')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'conteudos' },
        () => reload(true))
      .subscribe();
    return () => sb.removeChannel(channel);
  }, []);

  function showToast(msg, kind = "info") {
    const id = Date.now();
    setToast({ id, msg, kind });
    setTimeout(() => setToast(cur => (cur && cur.id === id ? null : cur)), 3600);
  }

  async function createItem(data) {
    if (saving) return;
    setSaving(true);
    showToast("Enviando conteúdo…", "info");
    try {
      const id = await nextId();
      const item = {
        ...data, id, dataEnvio: nowStr(),
        status: 'Aguardando aprovação',
        comentarios: '', dataDecisao: '', notas: [], versaoCorrigida: '',
        parecerSecundario: '', comentarioSecundario: '',
        statusExterno: '', comentarioExterno: '', dataExterna: '',
      };
      // Aviso de conflito de Notion ID
      if (item.notionId && items) {
        const nid = String(item.notionId).replace(/\D/g, '');
        const cobreTexto = t => t === "Texto" || t === "Ambos";
        const cobreArte  = t => t === "Arte"  || t === "Ambos";
        const conflito = items.find(it =>
          it.notionId && String(it.notionId).replace(/\D/g, '') === nid &&
          ((cobreTexto(item.tipoAprovacao) && cobreTexto(it.tipoAprovacao)) ||
           (cobreArte(item.tipoAprovacao)  && cobreArte(it.tipoAprovacao)))
        );
        if (conflito) {
          const conflitoUrl = `https://aprovacoes-dti.pages.dev/?id=${conflito.id}`;
          showToast(React.createElement("span", null,
            `⚠️ ID ${item.notionId} já vinculado ao `,
            React.createElement("a", { href: conflitoUrl, target: "_blank", rel: "noopener noreferrer", style: { color: "inherit", fontWeight: 700, textDecoration: "underline" } }, conflito.id),
            ` (${conflito.tipoAprovacao}). O link anterior no Notion será preservado como comentário.`
          ), "info");
        }
      }

      const { error } = await sb.from('conteudos').insert(toDb(item));
      if (error) throw error;
      setItems(arr => [item, ...(arr || [])]);
      showToast(`Conteúdo ${id} enviado para a fila.`, "success");
      if (!/^testes?$/i.test(item.titulo.trim())) notifyTeams('Novo conteúdo enviado', item);
      syncNotionUrl(item).catch((e) => showToast("Notion: " + (e.message || e), "error"));
      setRoute("fila");
    } catch (e) {
      showToast("Erro ao enviar: " + (e.message || e), "error");
    }
    setSaving(false);
  }

  function updateItem(id, patch) {
    // Notificação com item já mesclado (antes de atualizar estado).
    const label = updateLabel(patch);
    if (label && items) {
      const it = items.find(x => x.id === id);
      if (it) notifyTeams(label, { ...it, ...patch });
    }
    // Atualização otimista: muda na tela imediatamente.
    setItems(arr => arr ? arr.map(it => it.id === id ? { ...it, ...patch } : it) : arr);
    // Persiste no Supabase.
    sb.from('conteudos').update(patchToDb(patch)).eq('id', id).then(({ error }) => {
      if (error) { showToast("Erro ao salvar: " + error.message, "error"); reload(true); }
    });
  }

  function deleteItem(id) {
    setItems(arr => (arr || []).filter(it => it.id !== id));
    showToast("Conteúdo " + id + " excluído.", "info");
    sb.from('conteudos').delete().eq('id', id).then(({ error }) => {
      if (error) { showToast("Erro ao excluir: " + error.message, "error"); reload(true); }
    });
  }

  const isExterno = user === USUARIO_EXTERNO;
  const cfEmail   = readCFEmail();
  const isAdmin   = cfEmail && ADMIN_EMAILS.includes(cfEmail);

  const pendingForMe = (items || []).filter(it => it.aprovador === user && it.status === "Aguardando aprovação").length;
  const secondaryForMe = (items || []).filter(it => it.aprovadorSecundario === user && it.status === "Aguardando aprovação" && !it.parecerSecundario).length;
  const adjustForMe  = (items || []).filter(it => it.autor === user && it.status === "Ajustes solicitados").length;

  const Brand = (
    <div className="brand">
      <img className="brand-icon" src={ICONE_SISTEMA} alt="" />
      <span className="brand-text"><b>dti</b> aprovações</span>
    </div>
  );

  const UserPicker = (
    <div className="userpick">
      <button className="userpick-btn" onClick={() => setUserOpen(o => !o)}>
        <Avatar name={user} size={30} />
        <span className="userpick-name">{user}</span>
        <Icon name="chevron" size={15} />
      </button>
      {userOpen && (
        <>
          <div className="userpick-scrim" onClick={() => setUserOpen(false)} />
          <div className="userpick-menu">
            <span className="userpick-head">Você é…</span>
            {TEAM_ATIVOS.map(n => (
              <button key={n} className={"userpick-opt" + (n === user ? " is-active" : "")}
                onClick={() => { setUser(n); setUserOpen(false); }}>
                <Avatar name={n} size={26} />{n}
                {n === user && <Icon name="check2" size={15} style={{ marginLeft: "auto" }} />}
              </button>
            ))}
            {TEAM_INATIVOS.length > 0 && (
              <>
                <span className="userpick-head" style={{marginTop:6}}>Histórico</span>
                <button className={"userpick-opt" + (user === USUARIO_ANTERIORES ? " is-active" : "")}
                  onClick={() => { setUser(USUARIO_ANTERIORES); setUserOpen(false); }}>
                  <span className="avatar" style={{width:26,height:26,background:"#9AA1A4",fontSize:11,fontWeight:700,display:"inline-flex",alignItems:"center",justifyContent:"center",borderRadius:"50%",color:"#fff",flexShrink:0}}>UA</span>
                  {USUARIO_ANTERIORES}
                  {user === USUARIO_ANTERIORES && <Icon name="check2" size={15} style={{ marginLeft: "auto" }} />}
                </button>
              </>
            )}
            <span className="userpick-head" style={{marginTop:6}}>Acesso externo</span>
            <button className={"userpick-opt" + (user === USUARIO_EXTERNO ? " is-active" : "")}
              onClick={() => { setUser(USUARIO_EXTERNO); setUserOpen(false); }}>
              <span className="avatar" style={{width:26,height:26,background:"#9AA1A4",fontSize:11,fontWeight:700,display:"inline-flex",alignItems:"center",justifyContent:"center",borderRadius:"50%",color:"#fff",flexShrink:0}}>V</span>
              {USUARIO_EXTERNO}
              {user === USUARIO_EXTERNO && <Icon name="check2" size={15} style={{ marginLeft: "auto" }} />}
            </button>
          </div>
        </>
      )}
    </div>
  );

  const visibleNav = isExterno
    ? NAV.filter(n => n.id === "fila")
    : NAV.filter(n => !n.adminOnly || isAdmin);
  const NavItems = visibleNav.map(n => (
    <button key={n.id} className={"navitem" + (route === n.id ? " is-active" : "")}
      onClick={() => setRoute(n.id)}>
      <Icon name={n.icon} size={19} />
      <span>{n.label}</span>
      {n.id === "aprovador" && pendingForMe > 0 && <span className="nav-badge" title="Pendentes como aprovador principal">{pendingForMe}</span>}
      {n.id === "aprovador" && secondaryForMe > 0 && <span className="nav-badge is-secondary" title="Pendentes para seu parecer (secundário)">{secondaryForMe}</span>}
      {n.id === "meus"      && adjustForMe  > 0 && <span className="nav-badge">{adjustForMe}</span>}
    </button>
  ));

  let content;
  if (loadError) {
    content = (
      <div className="view">
        <div className="empty big">
          <Icon name="x" size={28} />
          <p><strong>Não consegui conectar ao banco de dados.</strong></p>
          <p>{loadError}</p>
          <Button variant="primary" icon="refresh" onClick={() => reload()}>Tentar de novo</Button>
        </div>
      </div>
    );
  } else if (items === null) {
    content = <div className="view"><div className="empty big"><Icon name="clock" size={28} /><p>Carregando conteúdos…</p></div></div>;
  } else if (route === "enviar" && !isExterno) {
    content = <SubmitView currentUser={user} onCreate={createItem} toast={showToast} />;
  } else if (route === "meus" && !isExterno) {
    content = <MyView items={items} currentUser={user} onUpdate={updateItem} onDelete={deleteItem} toast={showToast} />;
  } else if (route === "aprovador" && !isExterno) {
    content = <ApproverView items={items} currentUser={user} onUpdate={updateItem} onDelete={deleteItem} toast={showToast} irParaFila={() => setRoute("fila")} />;
  } else if (route === "config" && isAdmin) {
    content = <ConfigView toast={showToast} onTeamChange={onTeamChange} />;
  } else {
    content = <QueueView items={items} currentUser={user} onUpdate={updateItem} onDelete={deleteItem} toast={showToast} initialOpenId={urlId} />;
  }

  return (
    <>
      {!user && (
        <WhoAreYouModal
          onConfirm={confirmUser}
          suggested={cfSuggested || savedUser}
        />
      )}
      <div className="app nav-sidebar" style={!user ? {filter:"blur(3px)",pointerEvents:"none",userSelect:"none"} : {}}>
        <aside className="sidebar">
          {Brand}
          <nav className="nav">{NavItems}</nav>
          <button className="navitem" onClick={() => { reload(true); showToast("Lista atualizada.", "info"); }}>
            <Icon name="refresh" size={18} /><span>Atualizar</span>
          </button>
          <div className="sidebar-foot">{UserPicker}</div>
        </aside>
        <main className="main">{content}</main>
        <Toast toast={toast} />
      </div>
    </>
  );
}

// ── Inicialização: carrega equipe e config do Supabase, depois renderiza ──
async function init() {
  try {
    const [{ data: equipe }, { data: cfg }] = await Promise.all([
      sb.from('equipe').select('nome, ativo, email').order('ordem'),
      sb.from('config').select('chave, valor'),
    ]);
    if (equipe && equipe.length > 0) {
      window.TEAM          = equipe.map(r => r.nome);
      window.TEAM_ATIVOS   = equipe.filter(r => r.ativo).map(r => r.nome);
      window.TEAM_INATIVOS = equipe.filter(r => !r.ativo).map(r => r.nome);
      TEAM_ATIVOS   = window.TEAM_ATIVOS;
      TEAM_INATIVOS = window.TEAM_INATIVOS;
      window.__TEAM_EMAILS__ = {};
      equipe.forEach(r => { if (r.email) window.__TEAM_EMAILS__[r.nome] = r.email; });
    }
    (cfg || []).forEach(r => {
      if (r.chave === 'apps_script_notify_url' && r.valor) window.__NOTIFY_URL__ = r.valor;
      if (r.chave === 'notion_token' && r.valor) window.__NOTION_TOKEN__ = r.valor;
      if (r.chave === 'email_map' && r.valor) {
        try { window.__EMAIL_MAP__ = JSON.parse(r.valor); } catch {}
      }
    });
  } catch {}
  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(<App />);
}

init();

</script>
</body>
</html>
