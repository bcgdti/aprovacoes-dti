/* ════════════════════ CONFIGURAÇÕES (admin) ════════════════════ */
function ConfigView({ toast, onTeamChange }) {
  const [equipe, setEquipe] = useS(null);
  const [editingEmail, setEditingEmail] = useS(null);
  const [emailDraft, setEmailDraft] = useS('');
  const [newNome, setNewNome] = useS('');
  const [newEmail, setNewEmail] = useS('');
  const [busy, setBusy] = useS(false);

  async function load() {
    const { data } = await sb.from('equipe').select('nome, ativo, email, ordem').order('ordem');
    setEquipe(data || []);
  }

  useEffect_(() => { load(); }, []);

  async function reloadGlobals() {
    const { data } = await sb.from('equipe').select('nome, ativo, email').order('ordem');
    if (!data) return;
    window.TEAM          = data.map(r => r.nome);
    window.TEAM_ATIVOS   = data.filter(r => r.ativo).map(r => r.nome);
    window.TEAM_INATIVOS = data.filter(r => !r.ativo).map(r => r.nome);
    window.__TEAM_EMAILS__ = {};
    data.forEach(r => { if (r.email) window.__TEAM_EMAILS__[r.nome] = r.email; });
    TEAM_ATIVOS   = window.TEAM_ATIVOS;
    TEAM_INATIVOS = window.TEAM_INATIVOS;
    if (onTeamChange) onTeamChange();
  }

  async function toggleAtivo(member, ativo) {
    setBusy(true);
    const { error } = await sb.from('equipe').update({ ativo }).eq('nome', member.nome);
    if (error) toast('Erro: ' + error.message, 'error');
    else {
      toast(ativo ? member.nome + ' reativado.' : member.nome + ' movido para usuários anteriores.', 'success');
      await load(); await reloadGlobals();
    }
    setBusy(false);
  }

  async function saveEmail(member) {
    setBusy(true);
    const { error } = await sb.from('equipe').update({ email: emailDraft.trim() }).eq('nome', member.nome);
    if (error) toast('Erro: ' + error.message, 'error');
    else {
      toast('E-mail atualizado.', 'success');
      setEditingEmail(null);
      await load(); await reloadGlobals();
    }
    setBusy(false);
  }

  async function addMember() {
    if (!newNome.trim()) return;
    setBusy(true);
    const maxOrdem = (equipe || []).reduce((m, e) => Math.max(m, e.ordem || 0), 0);
    const { error } = await sb.from('equipe').insert({ nome: newNome.trim(), ativo: true, email: newEmail.trim(), ordem: maxOrdem + 1 });
    if (error) toast('Erro: ' + error.message, 'error');
    else {
      toast(newNome.trim() + ' adicionado à equipe.', 'success');
      setNewNome(''); setNewEmail('');
      await load(); await reloadGlobals();
    }
    setBusy(false);
  }

  const ativos   = (equipe || []).filter(m => m.ativo);
  const inativos = (equipe || []).filter(m => !m.ativo);

  function memberRow(m) {
    const isEditing = editingEmail === m.nome;
    return (
      <div key={m.nome} style={{display:'flex',alignItems:'center',gap:12,padding:'12px 16px',background:'var(--surface-2)',borderRadius:'var(--radius-sm)',border:'1px solid var(--line-2)',opacity:m.ativo?1:.65}}>
        <Avatar name={m.nome} size={34}/>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontWeight:600,fontSize:15}}>{m.nome}</div>
          {isEditing ? (
            <div style={{display:'flex',gap:6,marginTop:5,alignItems:'center',flexWrap:'wrap'}}>
              <input className="input" style={{padding:'5px 9px',fontSize:13,height:'auto',maxWidth:280}}
                value={emailDraft} onChange={e => setEmailDraft(e.target.value)}
                placeholder="email@dtidigital.com.br" autoFocus />
              <Button variant="primary" size="sm" icon="check2" disabled={busy} onClick={() => saveEmail(m)}>Salvar</Button>
              <Button variant="ghost" size="sm" onClick={() => setEditingEmail(null)}>Cancelar</Button>
            </div>
          ) : (
            <div style={{display:'flex',alignItems:'center',gap:5,marginTop:2}}>
              <span style={{fontSize:13,color:'var(--ink-3)'}}>{m.email || <em>e-mail não definido</em>}</span>
              <button style={{background:'none',border:'none',cursor:'pointer',color:'var(--ink-3)',padding:'1px 4px',borderRadius:4}}
                title="Editar e-mail" onClick={() => { setEditingEmail(m.nome); setEmailDraft(m.email || ''); }}>
                <Icon name="edit" size={13}/>
              </button>
            </div>
          )}
        </div>
        {!isEditing && (
          m.ativo
            ? <Button variant="ghost" size="sm" disabled={busy} onClick={() => toggleAtivo(m, false)}>Mover para anteriores</Button>
            : <Button variant="outline" size="sm" disabled={busy} onClick={() => toggleAtivo(m, true)}>Reativar</Button>
        )}
      </div>
    );
  }

  return (
    <div className="view view-narrow">
      <header className="view-head">
        <h1>Configurações</h1>
        <p>Gerencie os membros da equipe. Apenas administradores têm acesso.</p>
      </header>

      <div className="card form">
        <div className="section-label">
          <Icon name="users" size={17}/>Membros ativos
          <span className="count-pill">{ativos.length}</span>
        </div>
        {equipe === null
          ? <div className="empty"><Icon name="clock" size={22}/><p>Carregando…</p></div>
          : <div style={{display:'flex',flexDirection:'column',gap:8}}>{ativos.map(memberRow)}</div>
        }
      </div>

      {inativos.length > 0 && (
        <div className="card form" style={{marginTop:16}}>
          <div className="section-label muted">
            <Icon name="users" size={17}/>Usuários anteriores
            <span className="count-pill">{inativos.length}</span>
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:8}}>{inativos.map(memberRow)}</div>
        </div>
      )}

      <div className="card form" style={{marginTop:16}}>
        <div className="section-label"><Icon name="check2" size={17}/>Adicionar membro</div>
        <Field label="Nome" required>
          <input className="input" value={newNome} onChange={e => setNewNome(e.target.value)} placeholder="Ex.: Fernanda" />
        </Field>
        <Field label="E-mail do Teams" hint="Usado para @menções nas notificações">
          <input className="input" value={newEmail} onChange={e => setNewEmail(e.target.value)} placeholder="nome@dtidigital.com.br" />
        </Field>
        <div className="form-actions">
          <Button variant="primary" icon="check2" disabled={!newNome.trim() || busy} onClick={addMember}>
            Adicionar à equipe
          </Button>
        </div>
      </div>
    </div>
  );
}

Object.assign(window, { SubmitView, QueueView, ApproverView, MyView, EditPanel, ResendPanel, ConfigView });

</script>
<script type="text/babel" data-presets="react">
// app.jsx — raiz: navegação, usuário, estado + sincronização com Supabase.
const { useState: useState_, useEffect: useEffect_ } = React;
const { createClient } = supabase;

// Cliente Supabase — reutilizado em todo o app.
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

const NAV = [
  { id: "enviar",    label: "Enviar conteúdo",    icon: "send" },
  { id: "meus",      label: "Meus envios",         icon: "user" },
  { id: "fila",      label: "Fila de aprovação",   icon: "inbox" },
  { id: "aprovador", label: "Painel do aprovador", icon: "check" },
  { id: "config",    label: "Configurações",       icon: "settings", adminOnly: true },
];

// ── Converte linha do banco (snake_case) → objeto do app (camelCase) ──
function fromDb(r) {
  return {
    id: r.id,
    dataEnvio: r.data_envio || '',
    autor: r.autor || '',
    canal: r.canal || '',
    tipoAprovacao: r.tipo_aprovacao || '',
    titulo: r.titulo || '',
    conteudo: r.conteudo || '',
    linkMidia: r.link_midia || '',
    status: r.status || 'Aguardando aprovação',
    checkIA: r.check_ia || false,
    aprovador: r.aprovador || '',
    dataPostagem: r.data_postagem || '',
    comentarios: r.comentarios || '',
    dataDecisao: r.data_decisao || '',
    notas: Array.isArray(r.notas) ? r.notas : [],
    versaoCorrigida: r.versao_corrigida || '',
    aprovadorSecundario: r.aprovador_secundario || '',
    parecerSecundario: r.parecer_secundario || '',
    comentarioSecundario: r.comentario_secundario || '',
    precisaExterna: r.precisa_externa || false,
    contatoExterno: r.contato_externo || '',
    statusExterno: r.status_externo || '',
    comentarioExterno: r.comentario_externo || '',
    dataExterna: r.data_externa || '',
    historicoAjustes: Array.isArray(r.historico_ajustes) ? r.historico_ajustes : [],
  };
}

// ── Converte objeto do app → linha do banco ──────────────────────
function toDb(it) {
  return {
    id: it.id, data_envio: it.dataEnvio, autor: it.autor,
    canal: it.canal, tipo_aprovacao: it.tipoAprovacao,
    titulo: it.titulo, conteudo: it.conteudo,
    link_midia: it.linkMidia || '', status: it.status,
    check_ia: !!it.checkIA, aprovador: it.aprovador,
    data_postagem: it.dataPostagem || '', comentarios: it.comentarios || '',
    data_decisao: it.dataDecisao || '', notas: it.notas || [],
    versao_corrigida: it.versaoCorrigida || '',
    aprovador_secundario: it.aprovadorSecundario || '',
    parecer_secundario: it.parecerSecundario || '',
    comentario_secundario: it.comentarioSecundario || '',
    precisa_externa: !!it.precisaExterna,
    contato_externo: it.contatoExterno || '',
    status_externo: it.statusExterno || '',
    comentario_externo: it.comentarioExterno || '',
    data_externa: it.dataExterna || '',
    historico_ajustes: it.historicoAjustes || [],
  };
}

// ── Converte apenas os campos de um patch (atualização parcial) ──
const _PM = {
  dataEnvio:'data_envio', tipoAprovacao:'tipo_aprovacao', linkMidia:'link_midia',
  checkIA:'check_ia', dataPostagem:'data_postagem', dataDecisao:'data_decisao',
  versaoCorrigida:'versao_corrigida', aprovadorSecundario:'aprovador_secundario',
  parecerSecundario:'parecer_secundario', comentarioSecundario:'comentario_secundario',
  precisaExterna:'precisa_externa', contatoExterno:'contato_externo',
  statusExterno:'status_externo', comentarioExterno:'comentario_externo',
  dataExterna:'data_externa', historicoAjustes:'historico_ajustes',
};
function patchToDb(patch) {
  const out = {};
  for (const [k, v] of Object.entries(patch)) out[_PM[k] || k] = v;
  return out;
}

// ── Próximo ID sequencial (C-001, C-002…) ───────────────────────
async function nextId() {
  const { data } = await sb.from('conteudos').select('id');
  let max = 0;
  (data || []).forEach(r => {
    const m = String(r.id).match(/^C-(\d+)/);
    if (m) max = Math.max(max, parseInt(m[1], 10));
  });
  return 'C-' + String(max + 1).padStart(3, '0');
}

// ── Hora atual formatada ─────────────────────────────────────────
function nowStr() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

// ── Decide o rótulo da notificação a partir do que mudou ─────────
function updateLabel(patch) {
  if (patch.statusExterno === 'Aprovado') return 'Aprovação externa concluída';
  if (patch.statusExterno === 'Com ressalvas') return 'Ajustes solicitados (aprovação externa)';
  if (patch.status === 'Aguardando aprovação externa') return 'Aprovado internamente — aguardando externa';
  if (patch.status === 'Aprovado') return 'Conteúdo aprovado';
  if (patch.parecerSecundario === 'Com ressalvas') return 'Ajustes solicitados pelo 2º aprovador';
  if (patch.status === 'Ajustes solicitados') return 'Ajustes solicitados';
  if (patch.versaoCorrigida && patch.status === 'Aguardando aprovação') return 'Versão corrigida reenviada';
  if (patch.parecerSecundario) return 'Parecer do secundário: ' + patch.parecerSecundario;
  if (patch.notas !== undefined) return ''; // comentários no texto não notificam
  return 'Conteúdo atualizado';
}

// ── Notificação no Teams via Apps Script como proxy ──────────────
function notifyTeams(acao, item) {
  const url = window.__NOTIFY_URL__;
  if (!url) return;
  const link = window.location.origin + window.location.pathname + "?id=" + encodeURIComponent(item.id);
  fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: 'notify', acao, item, link, teamEmails: window.__TEAM_EMAILS__ || {} }),
  }).catch(() => {});
}

// Tenta ler o e-mail do JWT do Cloudflare Access (cookie CF_Authorization)
function readCFEmail() {
  try {
    const cookie = document.cookie.split(';').map(c => c.trim()).find(c => c.startsWith('CF_Authorization='));
    if (!cookie) return null;
    const jwt = cookie.split('=').slice(1).join('=');
    const payload = jwt.split('.')[1];
    if (!payload) return null;
    const json = JSON.parse(atob(payload.replace(/-/g,'+').replace(/_/g,'/')));
    return json.email || null;
  } catch { return null; }
}

// Tenta mapear e-mail do Cloudflare para um nome da equipe
function cfEmailToName(email) {
  if (!email) return null;
  const map = window.__EMAIL_MAP__ || {};
  if (map[email]) return map[email];
  // fallback: tenta pelo prefixo do e-mail (ex: alice.goncalves → Alice)
  const prefix = email.split('@')[0].split('.')[0];
  const match = TEAM_ATIVOS.find(n => n.toLowerCase() === prefix.toLowerCase());
  return match || null;
}

function WhoAreYouModal({ onConfirm, suggested }) {
  const [sel, setSel] = useState_(suggested || null);
  const cfEmail = readCFEmail();
  return (
    <div className="who-overlay">
      <div className="who-card">
        <div className="who-header">
          <h2>Olá! Quem é você?</h2>
          <p>Selecione seu nome para continuar. Isso garante que suas ações fiquem registradas corretamente.</p>
        </div>
        {suggested && cfEmail && (
          <div className="who-cf-hint">
            <Icon name="check2" size={15} />
            Identificado pelo login: <strong>{cfEmail}</strong>
          </div>
        )}
        <div className="who-grid">
          {TEAM_ATIVOS.map(n => (
            <button key={n} className={"who-opt" + (n === sel ? " is-selected" : "")}
              onClick={() => setSel(n)}>
              <Avatar name={n} size={32} />{n}
              {n === sel && <Icon name="check2" size={15} style={{marginLeft:"auto"}} />}
            </button>
          ))}
        </div>
        <div className="who-actions">
          <button className="who-ext-btn" onClick={() => onConfirm(USUARIO_EXTERNO)}>
            <Icon name="user" size={15} />Entrar como visitante (só visualizar / comentar)
          </button>
          <Button variant="primary" icon="check2" disabled={!sel}
            onClick={() => sel && onConfirm(sel)}>
            Confirmar
          </Button>
        </div>
      </div>
    </div>
  );
}

function App() {
  const urlId = new URLSearchParams(window.location.search).get("id");
  const [route, setRoute] = useState_(urlId ? "fila" : "fila");
  const [teamKey, setTeamKey] = useState_(0);
  function onTeamChange() { setTeamKey(k => k + 1); }

  // Lê o usuário salvo (para pré-selecionar no modal)
  const savedUser = (() => {
    try {
      const u = localStorage.getItem("dti_aprovacoes_user");
      return (TEAM_ATIVOS.includes(u) || u === USUARIO_ANTERIORES || u === USUARIO_EXTERNO) ? u : null;
    } catch { return null; }
  })();

  // Tenta auto-detectar pelo e-mail do Cloudflare
  const cfSuggested = cfEmailToName(readCFEmail());

  // Modal aparece toda vez que a sessão começa (sessionStorage limpa ao fechar aba)
  const sessionConfirmed = (() => { try { return !!sessionStorage.getItem("dti_who_confirmed"); } catch { return false; } })();

  const [user, setUser] = useState_(sessionConfirmed ? (savedUser || cfSuggested || TEAM_ATIVOS[0]) : null);
  const [items, setItems] = useState_(null);
  const [loadError, setLoadError] = useState_(null);
  const [toast, setToast] = useState_(null);
  const [userOpen, setUserOpen] = useState_(false);
  const [saving, setSaving] = useState_(false);

  function confirmUser(name) {
    setUser(name);
    try { localStorage.setItem("dti_aprovacoes_user", name); } catch {}
    try { sessionStorage.setItem("dti_who_confirmed", "1"); } catch {}
  }

  useEffect_(() => { if (user) { try { localStorage.setItem("dti_aprovacoes_user", user); } catch {} } }, [user]);

  async function reload(silent) {
    if (!silent) { setItems(null); setLoadError(null); }
    try {
      const { data, error } = await sb.from('conteudos').select('*').order('created_at', { ascending: false });
      if (error) throw error;
      setItems((data || []).map(fromDb));
      setLoadError(null);
    } catch (e) {
      if (!silent) setLoadError(String(e.message || e));
    }
  }

  useEffect_(() => {
    reload();
    // Atualização em tempo real: a fila muda sozinha quando alguém salva algo.
    const channel = sb.channel('conteudos-rt')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'conteudos' },
        () => reload(true))
      .subscribe();
    return () => sb.removeChannel(channel);
  }, []);

  function showToast(msg, kind = "info") {
    const id = Date.now();
    setToast({ id, msg, kind });
    setTimeout(() => setToast(cur => (cur && cur.id === id ? null : cur)), 3600);
  }

  async function createItem(data) {
    if (saving) return;
    setSaving(true);
    showToast("Enviando conteúdo…", "info");
    try {
      const id = await nextId();
      const item = {
        ...data, id, dataEnvio: nowStr(),
        status: 'Aguardando aprovação',
        comentarios: '', dataDecisao: '', notas: [], versaoCorrigida: '',
        parecerSecundario: '', comentarioSecundario: '',
        statusExterno: '', comentarioExterno: '', dataExterna: '',
      };
      const { error } = await sb.from('conteudos').insert(toDb(item));
      if (error) throw error;
      setItems(arr => [item, ...(arr || [])]);
      showToast(`Conteúdo ${id} enviado para a fila.`, "success");
      notifyTeams('Novo conteúdo enviado', item);
      setRoute("fila");
    } catch (e) {
      showToast("Erro ao enviar: " + (e.message || e), "error");
    }
    setSaving(false);
  }

  function updateItem(id, patch) {
    // Notificação com item já mesclado (antes de atualizar estado).
    const label = updateLabel(patch);
    if (label && items) {
      const it = items.find(x => x.id === id);
      if (it) notifyTeams(label, { ...it, ...patch });
    }
    // Atualização otimista: muda na tela imediatamente.
    setItems(arr => arr ? arr.map(it => it.id === id ? { ...it, ...patch } : it) : arr);
    // Persiste no Supabase.
    sb.from('conteudos').update(patchToDb(patch)).eq('id', id).then(({ error }) => {
      if (error) { showToast("Erro ao salvar: " + error.message, "error"); reload(true); }
    });
  }

  function deleteItem(id) {
    setItems(arr => (arr || []).filter(it => it.id !== id));
    showToast("Conteúdo " + id + " excluído.", "info");
    sb.from('conteudos').delete().eq('id', id).then(({ error }) => {
      if (error) { showToast("Erro ao excluir: " + error.message, "error"); reload(true); }
    });
  }

  const isExterno = user === USUARIO_EXTERNO;
  const cfEmail   = readCFEmail();
  const isAdmin   = cfEmail && ADMIN_EMAILS.includes(cfEmail);

  const pendingForMe = (items || []).filter(it => it.aprovador === user && it.status === "Aguardando aprovação").length;
  const adjustForMe  = (items || []).filter(it => it.autor === user && it.status === "Ajustes solicitados").length;

  const Brand = (
    <div className="brand">
      <span className="brand-mark">.</span>
      <span className="brand-text"><b>dti</b> aprovações</span>
    </div>
  );

  const UserPicker = (
    <div className="userpick">
      <button className="userpick-btn" onClick={() => setUserOpen(o => !o)}>
        <Avatar name={user} size={30} />
        <span className="userpick-name">{user}</span>
        <Icon name="chevron" size={15} />
      </button>
      {userOpen && (
        <>
          <div className="userpick-scrim" onClick={() => setUserOpen(false)} />
          <div className="userpick-menu">
            <span className="userpick-head">Você é…</span>
            {TEAM_ATIVOS.map(n => (
              <button key={n} className={"userpick-opt" + (n === user ? " is-active" : "")}
                onClick={() => { setUser(n); setUserOpen(false); }}>
                <Avatar name={n} size={26} />{n}
                {n === user && <Icon name="check2" size={15} style={{ marginLeft: "auto" }} />}
              </button>
            ))}
            {TEAM_INATIVOS.length > 0 && (
              <>
                <span className="userpick-head" style={{marginTop:6}}>Histórico</span>
                <button className={"userpick-opt" + (user === USUARIO_ANTERIORES ? " is-active" : "")}
                  onClick={() => { setUser(USUARIO_ANTERIORES); setUserOpen(false); }}>
                  <span className="avatar" style={{width:26,height:26,background:"#9AA1A4",fontSize:11,fontWeight:700,display:"inline-flex",alignItems:"center",justifyContent:"center",borderRadius:"50%",color:"#fff",flexShrink:0}}>UA</span>
                  {USUARIO_ANTERIORES}
                  {user === USUARIO_ANTERIORES && <Icon name="check2" size={15} style={{ marginLeft: "auto" }} />}
                </button>
              </>
            )}
            <span className="userpick-head" style={{marginTop:6}}>Acesso externo</span>
            <button className={"userpick-opt" + (user === USUARIO_EXTERNO ? " is-active" : "")}
              onClick={() => { setUser(USUARIO_EXTERNO); setUserOpen(false); }}>
              <span className="avatar" style={{width:26,height:26,background:"#9AA1A4",fontSize:11,fontWeight:700,display:"inline-flex",alignItems:"center",justifyContent:"center",borderRadius:"50%",color:"#fff",flexShrink:0}}>V</span>
              {USUARIO_EXTERNO}
              {user === USUARIO_EXTERNO && <Icon name="check2" size={15} style={{ marginLeft: "auto" }} />}
            </button>
          </div>
        </>
      )}
    </div>
  );

  const visibleNav = isExterno
    ? NAV.filter(n => n.id === "fila")
    : NAV.filter(n => !n.adminOnly || isAdmin);
  const NavItems = visibleNav.map(n => (
    <button key={n.id} className={"navitem" + (route === n.id ? " is-active" : "")}
      onClick={() => setRoute(n.id)}>
      <Icon name={n.icon} size={19} />
      <span>{n.label}</span>
      {n.id === "aprovador" && pendingForMe > 0 && <span className="nav-badge">{pendingForMe}</span>}
      {n.id === "meus"      && adjustForMe  > 0 && <span className="nav-badge">{adjustForMe}</span>}
    </button>
  ));

  let content;
  if (loadError) {
    content = (
      <div className="view">
        <div className="empty big">
          <Icon name="x" size={28} />
          <p><strong>Não consegui conectar ao banco de dados.</strong></p>
          <p>{loadError}</p>
          <Button variant="primary" icon="refresh" onClick={() => reload()}>Tentar de novo</Button>
        </div>
      </div>
    );
  } else if (items === null) {
    content = <div className="view"><div className="empty big"><Icon name="clock" size={28} /><p>Carregando conteúdos…</p></div></div>;
  } else if (route === "enviar" && !isExterno) {
    content = <SubmitView currentUser={user} onCreate={createItem} toast={showToast} />;
  } else if (route === "meus" && !isExterno) {
    content = <MyView items={items} currentUser={user} onUpdate={updateItem} onDelete={deleteItem} toast={showToast} />;
  } else if (route === "aprovador" && !isExterno) {
    content = <ApproverView items={items} currentUser={user} onUpdate={updateItem} onDelete={deleteItem} toast={showToast} />;
  } else if (route === "config" && isAdmin) {
    content = <ConfigView toast={showToast} onTeamChange={onTeamChange} />;
  } else {
    content = <QueueView items={items} currentUser={user} onUpdate={updateItem} onDelete={deleteItem} toast={showToast} initialOpenId={urlId} />;
  }

  return (
    <>
      {!user && (
        <WhoAreYouModal
          onConfirm={confirmUser}
          suggested={cfSuggested || savedUser}
        />
      )}
      <div className="app nav-sidebar" style={!user ? {filter:"blur(3px)",pointerEvents:"none",userSelect:"none"} : {}}>
        <aside className="sidebar">
          {Brand}
          <nav className="nav">{NavItems}</nav>
          <button className="navitem" onClick={() => { reload(true); showToast("Lista atualizada.", "info"); }}>
            <Icon name="refresh" size={18} /><span>Atualizar</span>
          </button>
          <div className="sidebar-foot">{UserPicker}</div>
        </aside>
        <main className="main">{content}</main>
        <Toast toast={toast} />
      </div>
    </>
  );
}

// ── Inicialização: carrega equipe e config do Supabase, depois renderiza ──
async function init() {
  try {
    const [{ data: equipe }, { data: cfg }] = await Promise.all([
      sb.from('equipe').select('nome, ativo, email').order('ordem'),
      sb.from('config').select('chave, valor'),
    ]);
    if (equipe && equipe.length > 0) {
      window.TEAM          = equipe.map(r => r.nome);
      window.TEAM_ATIVOS   = equipe.filter(r => r.ativo).map(r => r.nome);
      window.TEAM_INATIVOS = equipe.filter(r => !r.ativo).map(r => r.nome);
      TEAM_ATIVOS   = window.TEAM_ATIVOS;
      TEAM_INATIVOS = window.TEAM_INATIVOS;
      window.__TEAM_EMAILS__ = {};
      equipe.forEach(r => { if (r.email) window.__TEAM_EMAILS__[r.nome] = r.email; });
    }
    (cfg || []).forEach(r => {
      if (r.chave === 'apps_script_notify_url' && r.valor) window.__NOTIFY_URL__ = r.valor;
      if (r.chave === 'email_map' && r.valor) {
        try { window.__EMAIL_MAP__ = JSON.parse(r.valor); } catch {}
      }
    });
  } catch {}
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
}

init();

</script>
